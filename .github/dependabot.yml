version: 2

# Dependabot does the weekly dependency updates (claude-hosts#64, #12). It
# replaced the cloud routine that used to open "Weekly dependency updates" PRs
# from claude/dependency-updates.
#
# Each ecosystem is grouped into a single weekly PR. Only stable versions are
# offered, which is Dependabot's default; nothing here allows prereleases.
# Security updates are on as well and arrive as soon as an advisory is published.
#
# Dependabot doesn't update global.json's SDK version. .NET major upgrades come
# from the root session's yearly .NET watcher (claude-hosts#64, step 3).
updates:
  # Root, not /GitNanny: the solution has two projects and both carry package
  # references. Dependabot finds GitNanny.slnx at the root and updates both
  # projects in one PR. Scoping to /GitNanny missed GitNanny.Tests entirely,
  # which mattered when the Pkcs advisory landed in October 2026: it affected
  # both projects and the fix had to pin both.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
