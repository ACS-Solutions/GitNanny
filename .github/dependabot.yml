version: 2

# Security-only mode: version updates are off, security updates stay on.
#
# The weekly dependency routine (branch claude/dependency-updates) already
# bumps every outdated package and action to the latest stable, so Dependabot's
# version-update PRs duplicated that work and raced it — #6, #7 and #8 each sat
# open for months while the routine shipped the same bump, then had to be closed
# as superseded.
#
# open-pull-requests-limit: 0 disables version updates for an ecosystem.
# Security updates are explicitly unaffected by the setting, so a published
# advisory still raises a PR between routine runs, which is the part of
# Dependabot the routine cannot replace.
updates:
  # Root, not /GitNanny: the solution has two projects and both carry package
  # references. Scoping to /GitNanny missed GitNanny.Tests entirely, which
  # mattered when the Pkcs advisory landed in October 2026 — it affected both
  # projects and the fix had to pin both.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
